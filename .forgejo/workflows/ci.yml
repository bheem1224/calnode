name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: svelte-check (frontend types)
        working-directory: frontend
        run: pnpm check

      - name: i18n catalogue guard (call sites, no {@html})
        working-directory: frontend
        run: pnpm check:i18n

      - name: Build frontend (required by the Go embed)
        working-directory: frontend
        run: pnpm build

      - name: Install the browser for visual tests
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Visual smoke tests (computed styles in a real browser)
        working-directory: frontend
        run: pnpm test:visual

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          fmtout=$(gofmt -l .)
          if [ -n "$fmtout" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmtout"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: Native authentication browser verification
        run: |
          go build -o "$RUNNER_TEMP/calnode-auth-test" ./cmd/calnode
          PORT=39137 BASE_URL=http://localhost:39137 DATABASE_URL=sqlite://:memory: DEMO_MODE=false \
            CALNODE_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            "$RUNNER_TEMP/calnode-auth-test" > "$RUNNER_TEMP/native-auth-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then tail -n 60 "$RUNNER_TEMP/native-auth-server.log"; fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:39137/v1/auth/status >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          CALNODE_AUTH_TEST_URL=http://localhost:39137 node frontend/scripts/verify-native-auth.mjs

      - name: Booking feature browser matrix
        run: CALNODE_TEST_BINARY="$RUNNER_TEMP/calnode-auth-test" node frontend/scripts/verify-booking-flows.mjs

      - name: MCP and notification settings browser verification
        run: |
          PORT=39144 BASE_URL=http://localhost:39144 DATABASE_URL=sqlite://:memory: DEMO_MODE=false \
            CALNODE_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            "$RUNNER_TEMP/calnode-auth-test" > "$RUNNER_TEMP/agent-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then tail -n 60 "$RUNNER_TEMP/agent-server.log"; fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:39144/v1/auth/status >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          CALNODE_AGENT_TEST_URL=http://localhost:39144 node frontend/scripts/verify-agent-operations.mjs

      - name: Identity provider settings browser verification
        run: CALNODE_TEST_BINARY="$RUNNER_TEMP/calnode-auth-test" node frontend/scripts/verify-feature-suite.mjs --identity-only

      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Frontend vulnerability scan
        working-directory: frontend
        run: pnpm audit --audit-level=moderate

      - name: Translation coverage
        run: go run ./cmd/i18n-coverage
