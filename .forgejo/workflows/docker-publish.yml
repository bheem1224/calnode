name: Build and Publish Docker Image to Forgejo and GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Keep compilation separate from publication: a registry/proxy rejection
      # must not be mistaken for an application or Dockerfile build failure.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: |
            forgejo.jwala.net/${{ github.repository }}:latest
            forgejo.jwala.net/${{ github.repository }}:${{ github.sha }}
            ghcr.io/bheem1224/calnode:latest
            ghcr.io/bheem1224/calnode:${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}

      - name: Log in to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: forgejo.jwala.net
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # This workflow runs on Forgejo, so its github.token is a Forgejo token.
      # GHCR requires a separate GitHub classic PAT with write:packages.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Buildx reuses the preceding build's local layer cache. Publishing here
      # retains Buildx's provenance output rather than dropping attestations.
      - name: Publish Docker image to Forgejo and GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            forgejo.jwala.net/${{ github.repository }}:latest
            forgejo.jwala.net/${{ github.repository }}:${{ github.sha }}
            ghcr.io/bheem1224/calnode:latest
            ghcr.io/bheem1224/calnode:${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}

      - name: Registry failure guidance
        if: failure()
        run: |
          echo 'If Build Docker image passed, compilation succeeded. Check the registry login/publish step for the failing host.'
          echo 'REGISTRY_TOKEN must allow the Forgejo actor to write packages in the Forgejo repository namespace.'
          echo 'Forgejo Actions secrets GHCR_USERNAME and GHCR_TOKEN must name a GitHub account with package write access.'
          echo 'GHCR_TOKEN must be a GitHub classic PAT with write:packages; Forgejo github.token cannot push to GHCR.'
          echo 'See docs/registry-publishing.md. This job remains failed until publishing succeeds.'
