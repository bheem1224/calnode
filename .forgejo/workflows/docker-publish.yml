name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Keep compilation separate from publication: a registry/proxy rejection
      # must not be mistaken for an application or Dockerfile build failure.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: forgejo.jwala.net/${{ github.repository }}:latest
          build-args: |
            COMMIT=${{ github.sha }}

      - name: Log in to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: forgejo.jwala.net
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Buildx reuses the preceding build's local layer cache. Publishing here
      # retains Buildx's provenance output rather than dropping attestations.
      - name: Publish Docker image to Forgejo
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: forgejo.jwala.net/${{ github.repository }}:latest
          build-args: |
            COMMIT=${{ github.sha }}

      - name: Registry failure guidance
        if: failure()
        run: |
          echo 'If Build Docker image passed, compilation succeeded. Check the failed publishing/login step.'
          echo 'An HTML 403 on PUT /v2/.../blobs/uploads/... requires registry/reverse-proxy investigation.'
          echo 'Correlate the failed request with Cloudflare Security Events and proxy/Forgejo logs.'
          echo 'Verify REGISTRY_TOKEN package-write access, token account/username, and image-owner permissions.'
          echo 'See docs/registry-publishing.md. This job remains failed until publishing succeeds.'
